# Seed initial pour tracked_companies — chargé une seule fois via `npm run seed:portals`
# Après le seed, la gestion se fait via la DB Supabase / l'UI dashboard.
#
# ATS supportés : Greenhouse, Ashby, Lever
# - Greenhouse : careers_url contient "job-boards.greenhouse.io" ou "boards.greenhouse.io"
# - Ashby : careers_url contient "jobs.ashbyhq.com"
# - Lever : careers_url contient "jobs.lever.co"

# ============ AI LABS ============
- name: Anthropic
  careers_url: https://www.anthropic.com/careers
  api: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs
  category: ai-lab
  enabled: true

- name: OpenAI
