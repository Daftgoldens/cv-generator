# Seed initial pour scraper_searches — chargé via `npm run seed:searches`
# Couvre LinkedIn, WTTJ, Indeed, HelloWork pour tes 8 pays cibles.
# Volumes calibrés pour rester sous le radar (anti-ban LinkedIn).

# ============ FRANCE ============
- source: linkedin
  keywords: [Data Engineer, AI Engineer, ML Engineer]
  location: Paris, France
  country_code: FR
  remote_filter: [remote, hybrid, onsite]
  posted_within_hours: 24
  max_results: 25
  enabled: true

- source: wttj
  keywords: [data engineer, machine learning, AI engineer, founding engineer]
  location: paris
  country_code: FR
  max_results: 30
  enabled: true

- source: hellowork
  keywords: [Data Engineer, AI Engineer]
  location: Paris
  country_code: FR
  max_results: 20
  enabled: true

- source: indeed
  keywords: [AI Engineer, Data Engineer]
  location: Paris, France
  country_code: FR
  posted_within_hours: 48
  max_results: 20
  enabled: true

